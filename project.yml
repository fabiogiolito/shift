name: Shift
options:
  bundleIdPrefix: com.fabiogiolito
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  # Icon Composer documents are folders that Xcode compiles as one file.
  fileTypes:
    icon:
      file: true
      buildPhase: resources
# Both apps ship the same version and build number. scripts/release.sh bumps them.
settings:
  base:
    MARKETING_VERSION: "0.2.13"
    CURRENT_PROJECT_VERSION: "30"
packages:
  ShiftCore:
    path: Core
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
  # The plan editor: Markdown styled as it's typed (App/Views/Plans).
  MarkdownEngine:
    url: https://github.com/nodes-app/swift-markdown-engine
    exactVersion: 0.9.0
targets:
  Shift:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: ShiftCore
      - package: ShiftCore
        product: ShiftProtocol
      - package: Sparkle
      - package: MarkdownEngine
        product: MarkdownEngine
    # Merged with the generated Info.plist. xcodegen writes this file on every generate.
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SUFeedURL: $(SHIFT_FEED_URL)
        SUPublicEDKey: qJaiI+TqlGhpnbTJmAnkUuB5E5NLM/exMMkEyjxGf90=
        SUEnableAutomaticChecks: true
        # TelemetryDeck app ID for anonymous usage counts (App/Analytics.swift). Empty: nothing is sent.
        ShiftTelemetryAppID: $(SHIFT_TELEMETRY_APP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fabiogiolito.shift
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        # scripts/release.sh overrides it only to test against a local feed.
        SHIFT_FEED_URL: https://raw.githubusercontent.com/fabiogiolito/shift/main/appcast.xml
        SHIFT_TELEMETRY_APP_ID: ""
      configs:
        # Development builds are a separate app, "Shift Dev", with their own settings and data (~/.shift-dev),
        # so they never touch the tasks of the installed Shift.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.fabiogiolito.shift.dev
          INFOPLIST_KEY_CFBundleDisplayName: Shift Dev
        # Only Release builds check for updates, so development copies never do.
        Release:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: UPDATER
  # The phone's remote control of Shift on the Mac. Imports only ShiftProtocol.
  ShiftMobile:
    type: application
    platform: iOS
    sources:
      - iOS
      - App/Views/Shared/StatusIcon.swift
      - App/Views/Shared/MarkdownText.swift
      - App/Views/Shared/TextSize.swift
      - App/Views/Shared/EmptyState.swift
      - App/Views/Shared/RunningShimmer.swift
      - App/Views/Shared/Shared.xcassets
      - App/Resources/AppIcon.icon
    dependencies:
      - package: ShiftCore
        product: ShiftProtocol
    info:
      path: iOS/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: $(SHIFT_DISPLAY_NAME)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # App Store Connect rejects an iPad-capable build without all four.
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # Only HTTPS and system crypto, which is exempt; saves answering Missing Compliance on every build.
        ITSAppUsesNonExemptEncryption: false
        # What the Mac's QR code opens.
        CFBundleURLTypes:
          - CFBundleURLName: com.fabiogiolito.shift.pairing
            CFBundleURLSchemes: [shift-remote]
        # SHIFT_SERVER: a simulator build talks to its Mac build over plain loopback. Paired phones use HTTPS.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        # Signs the TestFlight upload. Here, so regenerating the project keeps it.
        DEVELOPMENT_TEAM: S9XPG3G4NU
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.fabiogiolito.shift.mobile.dev
          SHIFT_DISPLAY_NAME: Shift Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.fabiogiolito.shift.mobile
          SHIFT_DISPLAY_NAME: Shift
